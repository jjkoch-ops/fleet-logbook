<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fleet Logbook</title>
<meta name="theme-color" content="#e5a00d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css?v=8">
<script src="config.js?v=9"></script>
</head>
<body>
<header>
  <div class="wrap narrow"><div class="brand"><div class="mark" aria-hidden="true">FL</div><div><h1>Fleet Logbook</h1><span>Daily machine log</span></div></div></div>
  <div class="stripe"></div>
</header>

<main class="wrap narrow">
  <div id="status" class="banner" hidden></div>
  <div id="outbox" class="banner warn" hidden></div>

  <div id="done" class="done" hidden>
    <span id="doneText"></span>
    <button type="button" class="btn small" id="another">Log another entry</button>
  </div>

  <form id="f" class="form" novalidate>
    <p class="lead" style="margin:0" id="leadTxt">Fill this in at the end of each shift, one entry per machine. Trucks: one entry per trip, like the logbook.</p>
    <div class="row2">
      <div class="field"><label for="date">Date</label><input id="date" type="date" required></div>
      <div class="field"><label for="machine">Machine</label><select id="machine" required></select></div>
    </div>
    <div class="row2">
      <div class="field"><label for="operator">Your name</label><select id="operator" required></select></div>
      <div class="field" id="siteWrap"><label for="site">Site / client</label><select id="site"></select></div>
    </div>
    <div id="tripWrap" class="form" hidden>
      <div class="row2">
        <div class="field"><label for="tripFrom">Start location</label><select id="tripFrom"></select></div>
        <div class="field"><label for="tripTo">Stop location</label><select id="tripTo"></select></div>
      </div>
      <div class="field"><label for="material">Material / load</label><input id="material" list="materials" placeholder="e.g. G5, sand, rubble" autocomplete="off"><datalist id="materials"></datalist></div>
    </div>
    <div id="meters" class="meters">
      <div class="field" id="startHWrap" hidden><label for="startH">Start hours</label><div class="meter-wrap"><input id="startH" class="meter" type="number" inputmode="decimal" step="0.1" min="0"><span class="unit">h</span></div></div>
    <div class="field">
      <label for="reading" id="readingLbl">Hour meter</label>
      <div class="meter-wrap"><input id="reading" class="meter" type="number" inputmode="decimal" step="0.1" min="0" required><span class="unit" id="unit">h</span></div>
      <div class="hint" id="readingHint"></div>
    </div>
      <div class="field" id="startKmWrap" hidden><label for="startKm">Start km</label><div class="meter-wrap"><input id="startKm" class="meter" type="number" inputmode="numeric" step="1" min="0"><span class="unit">km</span></div></div>
    <div class="field" id="kmWrap" hidden>
      <label for="km" id="kmLbl">Odometer</label>
      <div class="meter-wrap"><input id="km" class="meter" type="number" inputmode="numeric" step="1" min="0"><span class="unit">km</span></div>
      <div class="hint" id="kmHint"></div>
    </div>
    </div>
    <div class="field">
      <span class="lbl" id="fuelLbl">Fuel level now</span>
      <div class="gauge" role="group" aria-labelledby="fuelLbl" id="fuel">
        <button type="button" data-v="0" aria-pressed="false">E</button><button type="button" data-v="25" aria-pressed="false">¼</button><button type="button" data-v="50" aria-pressed="false">½</button><button type="button" data-v="75" aria-pressed="false">¾</button><button type="button" data-v="100" aria-pressed="false">F</button>
      </div>
    </div>
    <div class="field"><label for="fuelAdded">Diesel added (litres)</label><input id="fuelAdded" type="number" inputmode="decimal" min="0" step="1" placeholder="0"></div>
    <div class="field">
      <span class="lbl" id="defLbl">Any defects or problems?</span>
      <div class="toggle" role="group" aria-labelledby="defLbl" id="defect">
        <button type="button" data-v="no" aria-pressed="true">No</button><button type="button" class="defect" data-v="yes" aria-pressed="false">Yes</button>
      </div>
    </div>
    <div class="field" id="defectWrap" hidden><label for="defectNote">Describe the problem</label><textarea id="defectNote" placeholder="e.g. Hydraulic hose leaking at front bucket ram"></textarea></div>
    <div class="field"><label for="photo">Photo of the dashboard / meter (optional)</label><input id="photo" type="file" accept="image/*" capture="environment"></div>
    <div class="field"><label for="pin">Site PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="4-digit PIN"><div class="hint">Your phone remembers the PIN after the first time.</div></div>
    <label class="check" id="confirmWrap" hidden><input type="checkbox" id="confirm"><span id="confirmText"></span></label>
    <div id="err" class="err" hidden></div>
    <button class="btn wide" id="submit" type="submit">Submit log</button>
  </form>
</main>

<script>
(function(){
const API = window.FLEET_API_URL;
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const pad = n => String(n).padStart(2,"0");
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const dayNum = s => { const [y,m,d] = s.split("-").map(Number); return Math.round(Date.UTC(y,m-1,d)/864e5); };
const fmtD = s => { if(!s) return ""; const [y,m,d] = s.split("-"); return `${+d} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m-1]}`; };
const store = { get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
                set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
const status = (t, cls) => { const s = $("#status"); s.textContent = t || ""; s.className = "banner" + (cls ? " "+cls : ""); s.hidden = !t; };

let cfg = store.get("fl_config", null);
let fuelPct = null, defect = false;

function fill(sel, items, placeholder){
  const el = $(sel), v = el.value;
  el.innerHTML = `<option value="">${placeholder}</option>` + items.map(([val,txt]) => `<option value="${String(val).replace(/"/g,"&quot;")}">${txt.replace(/</g,"&lt;")}</option>`).join("");
  if(items.some(([val]) => val === v)) el.value = v;
}
function render(){
  if(!cfg) return;
  fill("#machine", cfg.machines.map(m => [m.id, m.name]), "Choose machine");
  fill("#operator", cfg.operators.map(o => [o,o]), "Choose your name");
  const siteOpts = [...cfg.sites.map(o => [o,o]), ["__new__", "+ Add new site"]];
  fill("#site", siteOpts, "Choose site");
  fill("#tripFrom", siteOpts, "Choose start");
  fill("#tripTo", siteOpts, "Choose destination");
  $("#materials").innerHTML = (cfg.materials || []).map(x => `<option value="${String(x).replace(/"/g,"&quot;")}">`).join("");
  const lastOp = store.get("fl_operator", ""); if(lastOp && !$("#operator").value && cfg.operators.includes(lastOp)) $("#operator").value = lastOp;
  hint();
}
const machine = () => cfg && cfg.machines.find(m => m.id === $("#machine").value);

/* "+ Add new site": show a text box under the dropdown */
["site","tripFrom","tripTo"].forEach(id => {
  const sel = document.getElementById(id);
  const inp = document.createElement("input");
  inp.id = id + "New"; inp.placeholder = "Type the new site name"; inp.autocomplete = "off"; inp.hidden = true; inp.maxLength = 80;
  inp.setAttribute("aria-label", "New site name");
  sel.insertAdjacentElement("afterend", inp);
  sel.addEventListener("change", () => { inp.hidden = sel.value !== "__new__"; if(!inp.hidden) inp.focus(); });
});
const siteVal = id => { const v = $("#" + id).value; return v === "__new__" ? $("#" + id + "New").value.trim().replace(/\s+/g, " ") : v; };

function modeFields(){
  const m = machine();
  $("#kmWrap").hidden = !(m && m.km);
  $("#tripWrap").hidden = !(m && m.trips);
  $("#siteWrap").hidden = !!(m && m.trips);
  $("#startHWrap").hidden = $("#startKmWrap").hidden = !(m && m.trips);
  $("#meters").classList.toggle("trip", !!(m && m.trips));
  $("#kmLbl").textContent = m && m.trips ? "End km" : "Odometer";
  $("#submit").textContent = m && m.trips ? "Submit trip" : "Submit log";
  const kh = $("#kmHint");
  if(m && m.km && !m.trips) kh.textContent = m.lastKm != null ? `Last odometer ${m.lastKm} km.` : "First odometer reading for this machine.";
}
/* Trucks: start readings and start location carry over from the last trip */
function prefillTrip(){
  const m = machine(); if(!m || !m.trips) return;
  $("#startH").value = m.last ? m.last.reading : "";
  $("#startKm").value = m.lastKm != null ? m.lastKm : "";
  if(m.lastTo && cfg.sites.includes(m.lastTo)) $("#tripFrom").value = m.lastTo;
}
const startNum = id => { const v = parseFloat($("#" + id).value); return isNaN(v) ? null : v; };
function kmCheck(){
  const m = machine(); if(!m || !m.km) return {ok:true};
  const v = parseFloat($("#km").value), kh = $("#kmHint"); kh.className = "hint";
  if(isNaN(v)) return {ok:false, msg: m.trips ? "Enter the end km." : "Enter the odometer (km)."};
  if(m.trips){
    const sk = startNum("startKm");
    if(sk != null && m.lastKm != null && sk < m.lastKm) return {ok:false, msg:`Start km is lower than where the last trip ended (${m.lastKm} km).`};
    if(sk != null && v < sk){ kh.className = "hint bad"; kh.textContent = "End km is lower than start km."; return {ok:false, msg:"End km must be the same as or higher than start km."}; }
    kh.textContent = sk != null ? `Trip distance: ${Math.round(v - sk)} km.` : "";
    return {ok:true};
  }
  if(m.lastKm != null && v < m.lastKm){ kh.className = "hint bad"; kh.textContent = `Lower than the last odometer (${m.lastKm} km). Check it.`; return {ok:false, msg:`The odometer is lower than the last one (${m.lastKm} km).`}; }
  if(m.lastKm != null){ kh.textContent = `${Math.round(v - m.lastKm)} km since the last entry (last ${m.lastKm} km).`; if(v - m.lastKm > 1500){ kh.className = "hint warn"; } }
  return {ok:true};
}
$("#km").addEventListener("input", kmCheck);
$("#startKm").addEventListener("input", kmCheck);
$("#startH").addEventListener("input", () => hint());

function hint(){
  modeFields();
  const m = machine(), h = $("#readingHint");
  $("#unit").textContent = m && m.meter === "km" ? "km" : "h";
  $("#readingLbl").textContent = m && m.trips ? "End hours" : m && m.meter === "km" ? "Odometer" : "Hour meter";
  h.className = "hint"; $("#confirmWrap").hidden = true;
  if(!m){ h.textContent = ""; return {ok:true}; }
  const last = m.last, v = parseFloat($("#reading").value), u = m.meter === "km" ? "km" : "h";
  if(!last){ h.textContent = "First log for this machine."; return {ok:true}; }
  const lastTxt = `Last reading ${last.reading} ${u}${last.date ? " on " + fmtD(last.date) : ""}${last.operator ? " by " + last.operator : ""}.`;
  if(isNaN(v)){ h.textContent = lastTxt; return {ok:true}; }
  if(m.trips){
    const sh = startNum("startH");
    if(sh == null){ h.textContent = lastTxt; return {ok:false, msg:"Enter the start hours."}; }
    if(sh < last.reading){ h.className = "hint bad"; h.textContent = `Start hours are lower than where the last trip ended (${last.reading} h).`; return {ok:false, msg:`Start hours are lower than where the last trip ended (${last.reading} h).`}; }
    if(isNaN(v)){ h.textContent = `Last trip ended at ${last.reading} h.`; return {ok:true}; }
    if(v < sh){ h.className = "hint bad"; h.textContent = "End hours are lower than start hours."; return {ok:false, msg:"End hours must be the same as or higher than start hours."}; }
    h.textContent = `Trip time on the meter: ${Math.round((v - sh)*10)/10} h.`;
    if(v - sh > 16){ h.className = "hint warn"; $("#confirmWrap").hidden = false; $("#confirmText").textContent = `${Math.round((v - sh)*10)/10} h for one trip is unusually high. Tick to confirm.`; return {ok: $("#confirm").checked, msg:"Confirm the high reading, or correct it."}; }
    return {ok:true};
  }
  if(v < last.reading){ h.className = "hint bad"; h.textContent = `Lower than the last reading (${last.reading} ${u}). Check the meter.`; return {ok:false, msg:`The reading is lower than the last one (${last.reading} ${u}). Check the meter.`}; }
  const days = last.date ? Math.max(1, dayNum($("#date").value || today()) - dayNum(last.date)) : 1;
  const diff = Math.round((v - last.reading)*10)/10;
  h.textContent = `${diff} ${u} since the last log. ${lastTxt}`;
  if(diff > (m.meter === "km" ? 800 : 16) * days){
    h.className = "hint warn"; $("#confirmWrap").hidden = false;
    $("#confirmText").textContent = `${diff} ${u} is unusually high. Tick to confirm the reading is correct.`;
    return {ok: $("#confirm").checked, msg: "Confirm the high reading, or correct it."};
  }
  return {ok:true};
}

$("#fuel").addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return; fuelPct = Number(b.dataset.v); $$("#fuel button").forEach(x => x.setAttribute("aria-pressed", x===b)); });
$("#defect").addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return; defect = b.dataset.v === "yes"; $$("#defect button").forEach(x => x.setAttribute("aria-pressed", x===b)); $("#defectWrap").hidden = !defect; });
$("#machine").addEventListener("change", () => { prefillTrip(); hint(); kmCheck(); });
$("#reading").addEventListener("input", hint);
$("#date").addEventListener("change", hint);

function resizePhoto(file){
  return new Promise(resolve => {
    if(!file) return resolve(null);
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); resolve(c.toDataURL("image/jpeg", 0.7));
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

async function post(body){
  const r = await fetch(API, { method:"POST", body: JSON.stringify(body) });
  return r.json();
}

/* Outbox: logs saved on the phone when there's no signal */
function showOutbox(){
  const q = store.get("fl_outbox", []);
  const el = $("#outbox");
  el.hidden = !q.length;
  el.textContent = q.length ? `${q.length} log${q.length>1?"s":""} saved on this phone, waiting for signal. ${navigator.onLine ? "Sending…" : "They will send automatically."}` : "";
}
let flushing = false;
async function flush(){
  if(flushing) return; flushing = true;
  let q = store.get("fl_outbox", []);
  const keep = [];
  for(const item of q){
    try{
      const res = await post(item);
      if(!res.ok){ status(`A saved log for ${item.machine_name} on ${fmtD(item.date)} was rejected: ${res.error}`, "bad"); }
    }catch(e){ keep.push(item); }
  }
  store.set("fl_outbox", keep); flushing = false; showOutbox();
  if(q.length && !keep.length) loadConfig();
}
window.addEventListener("online", flush);

async function loadConfig(){
  if(!API || API.includes("PASTE_")){ status("This form isn't connected yet. The owner needs to add the Apps Script URL to config.js.", "bad"); return; }
  try{
    const r = await fetch(API + "?action=config");
    const j = await r.json();
    if(!j.ok) throw new Error(j.error);
    cfg = j; store.set("fl_config", cfg); render(); if(!$("#status").classList.contains("bad")) status("");
  }catch(e){
    if(cfg){ render(); status("No signal. Using the last saved machine list.", "warn"); }
    else status("Can't reach the logbook. Check your signal and reload.", "bad");
  }
}

$("#f").addEventListener("submit", async e => {
  e.preventDefault();
  const err = $("#err"); err.hidden = true;
  const fail = msg => { err.textContent = msg; err.hidden = false; err.scrollIntoView({block:"center", behavior:"smooth"}); };
  const m = machine();
  if(!cfg) return fail("The form hasn't loaded. Check your signal and reload.");
  if(!m) return fail("Choose the machine.");
  if(!$("#operator").value) return fail("Choose your name.");
  if(!$("#date").value) return fail("Enter the date.");
  if(isNaN(parseFloat($("#reading").value))) return fail("Enter the meter reading.");
  if(fuelPct == null) return fail("Tap the fuel level.");
  if(defect && !$("#defectNote").value.trim()) return fail("Describe the defect.");
  if(m.trips && !siteVal("tripFrom")) return fail($("#tripFrom").value === "__new__" ? "Type the name of the new start site." : "Choose where the trip started.");
  if(m.trips && !siteVal("tripTo")) return fail($("#tripTo").value === "__new__" ? "Type the name of the new destination." : "Choose where the trip ended.");
  if(!m.trips && $("#site").value === "__new__" && !siteVal("site")) return fail("Type the name of the new site.");
  const kc = kmCheck(); if(!kc.ok) return fail(kc.msg);
  if(!$("#pin").value.trim()) return fail("Enter the site PIN.");
  const chk = hint(); if(!chk.ok) return fail(chk.msg);

  const btn = $("#submit"); btn.disabled = true; btn.textContent = "Sending…";
  const body = {
    action:"log", pin: $("#pin").value.trim(), machine_id: m.id, machine_name: m.name,
    operator: $("#operator").value, site: m.trips ? "" : siteVal("site"), date: $("#date").value,
    reading: parseFloat($("#reading").value), fuel_pct: fuelPct, fuel_added: parseFloat($("#fuelAdded").value) || 0,
    defect, defect_note: defect ? $("#defectNote").value.trim() : "",
    odometer_km: m.km ? parseFloat($("#km").value) : null,
    start_hours: m.trips ? startNum("startH") : null, start_km: m.trips ? startNum("startKm") : null,
    trip_from: m.trips ? siteVal("tripFrom") : "", trip_to: m.trips ? siteVal("tripTo") : "", material: m.trips ? $("#material").value.trim() : "",
    photo: await resizePhoto($("#photo").files[0]), client_id: Date.now().toString(36) + Math.random().toString(36).slice(2,6)
  };
  store.set("fl_operator", body.operator);
  [body.site, body.trip_from, body.trip_to].forEach(v => { if(v && !cfg.sites.some(x => x.toLowerCase() === v.toLowerCase())) cfg.sites.push(v); });
  if(body.material && !(cfg.materials || []).some(x => x.toLowerCase() === body.material.toLowerCase())) (cfg.materials = cfg.materials || []).push(body.material);
  const u = m.meter === "km" ? "km" : "h";
  try{
    const res = await post(body);
    if(!res.ok){ btn.disabled = false; btn.textContent = m.trips ? "Submit trip" : "Submit log"; return fail(res.error || "The log was not saved."); }
    store.set("fl_pin", body.pin);
    m.last = { reading: body.reading, date: body.date, operator: body.operator }; if(m.km) m.lastKm = body.odometer_km; if(m.trips) m.lastTo = body.trip_to; store.set("fl_config", cfg);
    $("#doneText").innerHTML = m.trips ? `<b>Trip logged.</b> ${m.name}: ${body.trip_from} → ${body.trip_to}${body.start_km != null && body.odometer_km != null ? `, ${Math.round(body.odometer_km - body.start_km)} km` : ""}.` : `<b>Logged.</b> ${m.name} at ${body.reading} ${u}.`;
  }catch(x){
    // No signal: keep it on the phone and send later (photo dropped to save space)
    const q = store.get("fl_outbox", []); q.push({...body, photo:null}); store.set("fl_outbox", q);
    store.set("fl_pin", body.pin);
    m.last = { reading: body.reading, date: body.date, operator: body.operator }; if(m.km) m.lastKm = body.odometer_km; if(m.trips) m.lastTo = body.trip_to; store.set("fl_config", cfg);
    $("#doneText").innerHTML = `<b>Saved on this phone.</b> No signal right now. It will send automatically.`;
    showOutbox();
  }
  btn.disabled = false; btn.textContent = m.trips ? "Submit trip" : "Submit log";
  $("#f").hidden = true; $("#done").hidden = false; window.scrollTo(0,0);
});

$("#another").addEventListener("click", () => {
  const keep = machine() && machine().trips;
  if(!keep) $("#machine").value = "";
  $("#km").value = ""; $("#material").value = "";
  const lastTo = siteVal("tripTo");
  render();
  ["site","tripFrom","tripTo"].forEach(id => { $("#" + id + "New").value = ""; $("#" + id + "New").hidden = true; if($("#" + id).value === "__new__") $("#" + id).value = ""; });
  if(keep){ prefillTrip(); $("#tripFrom").value = lastTo; $("#tripTo").value = ""; } $("#reading").value = ""; $("#fuelAdded").value = ""; $("#defectNote").value = ""; $("#photo").value = ""; $("#confirm").checked = false;
  fuelPct = null; defect = false; $$("#fuel button").forEach(b => b.setAttribute("aria-pressed","false"));
  $$("#defect button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === "no")); $("#defectWrap").hidden = true;
  $("#done").hidden = true; $("#f").hidden = false; hint();
});

$("#date").value = today();
$("#pin").value = store.get("fl_pin", "");
render(); showOutbox(); loadConfig(); flush();
})();
</script>
</body>
</html>
